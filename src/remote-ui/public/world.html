<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AMA-teras WORLD</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; touch-action: none;
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; }
  #badge { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); background: #fff; color: #5a6b9e;
    font-size: 12px; font-weight: 600; padding: 4px 16px; border-radius: 999px; z-index: 30;
    box-shadow: 0 2px 12px rgba(90,123,216,.25); white-space: nowrap; }
  #badge .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 6px; }
  #badge.on .dot { background: #4ade80; }
  /* M126: チャットはアプリのオーバーレイ(z50)より手前=アプリを開いたままエージェントと話せる。
     M130: 吹き出しは半透明・アプリ表示中は直近3件だけ薄く出す(スマホで画面が隠れる問題) */
  #chatlog { position: fixed; left: 10px; bottom: 74px; max-width: min(78vw, 420px); max-height: 38vh;
    overflow-y: auto; z-index: 55; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  body.app-open #chatlog { max-height: 24vh; }
  body.app-open #chatlog .msg { opacity: .6; }
  body.app-open #chatlog .msg:not(:nth-last-child(-n+3)) { display: none; }
  .msg { padding: 7px 13px; border-radius: 16px; font-size: 13px; line-height: 1.5; width: fit-content;
    max-width: 100%; box-shadow: 0 2px 10px rgba(90,123,216,.18); word-break: break-word; }
  .msg.user { background: rgba(238,243,255,.85); color: #34406b; align-self: flex-end; }
  .msg.agent { background: rgba(255,255,255,.85); color: #445; }
  .msg.sys { background: transparent; box-shadow: none; color: #99a; font-size: 11px; }
  /* M130: 社の配置コントロール(シングルタップで表示。回転・高さを1タップずつ) */
  #kioskctl { position: fixed; left: 50%; transform: translateX(-50%); bottom: 70px; z-index: 56;
    display: none; gap: 6px; align-items: center; background: rgba(255,255,255,.94); border-radius: 999px;
    padding: 6px 10px; box-shadow: 0 6px 24px rgba(60,80,160,.25); }
  #kioskctl.on { display: flex; }
  #kioskctl button { border: none; background: #f0f2fa; color: #34406b; font-size: 16px; padding: 8px 13px; border-radius: 999px; }
  #kioskctl button:active { background: #dfe6ff; }
  #kioskctl .kname { font-size: 12px; color: #5a6b9e; font-weight: 700; padding: 0 6px; max-width: 90px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chatbar { position: fixed; left: 10px; right: 10px; bottom: 12px; display: flex; gap: 8px; z-index: 55; }
  #chatin { flex: 1; border: none; border-radius: 22px; padding: 12px 18px; font-size: 15px; background: #fff;
    box-shadow: 0 4px 18px rgba(90,123,216,.25); outline: none; color: #334; }
  #send { border: none; border-radius: 22px; padding: 0 20px; font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #7c9bff, #b18aff); box-shadow: 0 4px 18px rgba(120,190,255,.4); }
  .bub { position: fixed; padding: 10px 16px; background: #fff; border-radius: 18px; color: #445; font-size: 14px;
    box-shadow: 0 4px 18px rgba(90,123,216,.3); opacity: 0; transition: opacity .3s; pointer-events: none;
    z-index: 15; max-width: min(70vw, 300px); }
  #pair { position: fixed; inset: 0; background: #ffffffee; z-index: 40; display: none; align-items: center;
    justify-content: center; text-align: center; color: #5a6b9e; font-size: 14px; line-height: 2; padding: 20px; }
  #home { position: fixed; top: 6px; left: 10px; z-index: 31; border: none; background: #fff; color: #5a6b9e;
    font-size: 15px; padding: 5px 12px; border-radius: 999px; box-shadow: 0 2px 12px rgba(90,123,216,.25); }
  /* M120: アプリオーバーレイ(2Dで使う。3Dは見つける場所) */
  #appov { position: fixed; inset: 0; background: rgba(40,48,80,.45); z-index: 50; display: none; }
  #appov.on { display: flex; flex-direction: column; }
  #appbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  #apptitle { color: #fff; font-size: 16px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.4); flex: 1; }
  #appclose, #appleave { border: none; background: #fff; color: #5a6b9e; font-size: 15px; padding: 7px 16px; border-radius: 999px; }
  /* M127: 複数アプリを裏で生かしたまま切り替えるiframeプール */
  #appframes { flex: 1; position: relative; margin: 0 12px 12px; }
  #appframes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; border-radius: 14px;
    background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.35); display: none; }
  #appframes iframe.active { display: block; }
  #apppointer { position: fixed; z-index: 60; display: none; pointer-events: none; transform: translate(-50%, -100%);
    filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); text-align: center; }
  #apppointer .arrow { font-size: 44px; animation: bounce 0.8s infinite alternate; }
  #apppointer .pnote { background: #ff4d5e; color: #fff; font-size: 13px; font-weight: 700; padding: 5px 12px;
    border-radius: 999px; margin-bottom: 2px; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(10px); } }
  /* M121(3-B): 稼働可視化 — AMA-terasが「いま何をしているか」の生中継 */
  #work { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 25; background: #fff;

    display: none; }
  #work.on { display: block; }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  #livequeue { font-size: 11px; color: #99a; margin-top: 6px; }
  /* M141: 字幕(TTS読み上げと連動。スマホの小さいチャットが読めない問題の対策) */
  #subtitle { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 58;

    line-height: 1.5; padding: 10px 24px; border-radius: 14px; display: none; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  /* M141: 視聴者コメントの弾幕(右→左)と採用ポップ */
  .dan { position: fixed; z-index: 57; white-space: nowrap; font-weight: 800; font-size: 26px; color: #fff;

  .dan .who { font-size: 15px; opacity: .9; margin-right: 8px; color: #ffe95c; }
  .adoptpop { position: fixed; left: 50%; top: 32%; transform: translate(-50%,-50%); z-index: 59;
    background: linear-gradient(135deg, #ff5c8a, #ffb35c); color: #fff; border-radius: 20px;
    padding: 18px 34px; text-align: center; box-shadow: 0 10px 40px rgba(229,39,62,.45);
    animation: adoptin .45s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
  .adoptpop .abig { font-size: 30px; font-weight: 900; }
  .adoptpop .atxt { font-size: 20px; font-weight: 700; margin-top: 6px; max-width: 60vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adoptpop .aby { font-size: 14px; margin-top: 4px; opacity: .95; }
  @keyframes adoptin { from { transform: translate(-50%,-50%) scale(.4); opacity: 0; }
    to { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  /* M141: 配信(観戦)ページの強化 — 実況ボード大型化・アプリは右6割+世界は左に見え続ける */
  body.spectate #work { top: 48px; padding: 10px 18px; border-radius: 16px; }
  body.spectate #workhead { font-size: 17px; }
  body.spectate #worktail { font-size: 13px; max-width: 60vw; }
  body.spectate #appov { background: transparent; }
  body.spectate #appov.on { left: auto; right: 12px; top: 56px; bottom: 96px; width: 60vw; }
  body.spectate #appbar { display: none; }
  body.spectate #appframes { margin: 0; }
  /* 小さめの仮想画面(74%)を1.35倍に拡大表示=アプリのUIが大きく映る */
  body.spectate #appframes iframe { width: 74%; height: 74%; transform: scale(1.351); transform-origin: 0 0; }
  body.spectate #chatlog { display: none; }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script>
// QA: ロード時エラーの取りこぼし防止(コンソール追跡はナビゲーションでリセットされるため)
window.__errs = [];
addEventListener('error', (e) => window.__errs.push(String(e.error?.stack ?? e.message)));
addEventListener('unhandledrejection', (e) => window.__errs.push('rejection: ' + String(e.reason?.stack ?? e.reason)));
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ================= 認証(remote-ui と同じトークンを使う) =================
// ?spectate=1: M115-5 観戦モード(同一PC限定・読み取り専用SSE・トークン不要・発言不可)
// &cam=pov|front|overview: M116-B 固定カメラ(エージェントがscreenshotで自分の作品を見るため)
const QUERY = new URLSearchParams(location.search);
// ?viewer=1: c案の神視点ビューア(公開想定)。観戦の読み取り専用に加え、ユーザー操作での
// アプリ起動も封じる=できるのは視点操作(回転/ズーム/パン)だけ。世界に対して完全に無害
const VIEWER = QUERY.has('viewer');
const SPECTATE = QUERY.has('spectate') || VIEWER;
// ?executor=1&k=…: M117-B 常時実行モード(アプリ自身が開く隠しウィンドウ。世界の正実行体)
const EXECUTOR = QUERY.has('executor');
const EXEC_KEY = QUERY.get('k') ?? '';
const CAM_PRESET = QUERY.get('cam');
const TOKEN_KEY = 'amateras-remote-token';
const hashTok = /[#?&]t=([0-9a-f]{64})(?:[&#]|$)/.exec(location.hash)?.[1];
if (hashTok) localStorage.setItem(TOKEN_KEY, hashTok);
const TOKEN = hashTok ?? localStorage.getItem(TOKEN_KEY);
if (!TOKEN && !SPECTATE && !EXECUTOR) document.getElementById('pair').style.display = 'flex';
if (SPECTATE || EXECUTOR) {
  document.getElementById('chatbar').style.display = 'none';
  document.getElementById('bst').textContent = VIEWER ? '見学モード' : SPECTATE ? '観戦モード' : '実行係';
}
// M141: 観戦(=OBS配信画面)は専用レイアウト(実況ボード大・アプリ右6割・字幕)。
// 見学(viewer)は素の世界ビュー(配信オーバーレイなし=覗き窓に徹する)
if (SPECTATE && !VIEWER) document.body.classList.add('spectate');
// M141: 音声読み上げ(VOICEVOX)。&tts=1 で有効化・&spk=N で話者切替(既定2=四国めたんノーマル)
const TTS = QUERY.get('tts') === '1';
const TTS_SPK = /^\d{1,3}$/.test(QUERY.get('spk') ?? '') ? QUERY.get('spk') : '2';

async function post(ev) {
  if (SPECTATE) return true; // 観戦モードは読み取り専用(ackも打たない=実行側ページに任せる)
  try {
    const url = EXECUTOR ? `/api/world/event?k=${EXEC_KEY}` : '/api/world/event';
    const headers = { 'content-type': 'application/json' };
    if (!EXECUTOR) headers.authorization = `Bearer ${TOKEN}`;
    const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(ev) });
    return r.ok;
  } catch { return false; }
}

// ================= 3D世界(白い円盤広場) =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 30, 120);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdde4ff, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(10, 20, 10);
scene.add(sun);
const disc = new THREE.Mesh(new THREE.CylinderGeometry(20, 21, 0.6, 64), new THREE.MeshToonMaterial({ color: 0xffffff }));
disc.position.y = -0.3;
scene.add(disc);
for (let r = 3; r <= 18; r += 3.75) {
  const band = new THREE.Mesh(new THREE.TorusGeometry(r, 0.03, 6, 80), new THREE.MeshBasicMaterial({ color: 0xdfe6ff }));
  band.rotation.x = Math.PI / 2; band.position.y = 0.02;
  scene.add(band);
}
const PASTEL = [0xff5c8a, 0xffb35c, 0xffe95c, 0x7ce07c, 0x5cc8ff, 0xb18aff];
for (let i = 0; i < 14; i++) {
  const o = new THREE.Mesh(new THREE.TorusGeometry(0.9 + (i % 5) * 0.25, 0.25, 10, 24),
    new THREE.MeshToonMaterial({ color: PASTEL[i % 6] }));
  const a = (i / 14) * Math.PI * 2, d = 22 + (i % 4) * 7;
  o.position.set(Math.cos(a) * d, 3 + (i % 6) * 2.2, Math.sin(a) * d);
  o.rotation.set(i * 0.7, i * 1.3, 0);
  scene.add(o);
}

// ================= アバター(AMA-teras)+モーション =================
const mixamoVRMRigMap = {
  mixamorigHips: 'hips', mixamorigSpine: 'spine', mixamorigSpine1: 'chest', mixamorigSpine2: 'upperChest',
  mixamorigNeck: 'neck', mixamorigHead: 'head',
  mixamorigLeftShoulder: 'leftShoulder', mixamorigLeftArm: 'leftUpperArm', mixamorigLeftForeArm: 'leftLowerArm', mixamorigLeftHand: 'leftHand',
  mixamorigRightShoulder: 'rightShoulder', mixamorigRightArm: 'rightUpperArm', mixamorigRightForeArm: 'rightLowerArm', mixamorigRightHand: 'rightHand',
  mixamorigLeftUpLeg: 'leftUpperLeg', mixamorigLeftLeg: 'leftLowerLeg', mixamorigLeftFoot: 'leftFoot', mixamorigLeftToeBase: 'leftToes',
  mixamorigRightUpLeg: 'rightUpperLeg', mixamorigRightLeg: 'rightLowerLeg', mixamorigRightFoot: 'rightFoot', mixamorigRightToeBase: 'rightToes',
};
const fbxLoader = new FBXLoader();
async function loadMixamo(url, vrm) {
  const asset = await fbxLoader.loadAsync(url);
  const clip = THREE.AnimationClip.findByName(asset.animations, 'mixamo.com') ?? asset.animations[0];
  const tracks = [];
  const restRotationInverse = new THREE.Quaternion();
  const parentRestWorldRotation = new THREE.Quaternion();
  const _quatA = new THREE.Quaternion();
  const _vec3 = new THREE.Vector3();
  const hipsNode = asset.getObjectByName('mixamorigHips');
  const motionHipsHeight = hipsNode ? hipsNode.position.y : 100;
  const vrmHipsY = vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(_vec3).y;
  const vrmRootY = vrm.scene.getWorldPosition(_vec3).y;
  const hipsPositionScale = Math.abs(vrmHipsY - vrmRootY) / motionHipsHeight;
  for (const track of clip.tracks) {
    const [mixamoRigName, propertyName] = track.name.split('.');
    const vrmBoneName = mixamoVRMRigMap[mixamoRigName];
    const vrmNodeName = vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
    const mixamoRigNode = asset.getObjectByName(mixamoRigName);
    if (vrmNodeName == null || mixamoRigNode == null) continue;
    mixamoRigNode.getWorldQuaternion(restRotationInverse).invert();
    mixamoRigNode.parent.getWorldQuaternion(parentRestWorldRotation);
    if (track instanceof THREE.QuaternionKeyframeTrack) {
      const values = track.values.slice();
      for (let i = 0; i < values.length; i += 4) {
        _quatA.fromArray(values, i);
        _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
        _quatA.toArray(values, i);
      }
      tracks.push(new THREE.QuaternionKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, values));
    } else if (track instanceof THREE.VectorKeyframeTrack && vrmBoneName === 'hips') {
      tracks.push(new THREE.VectorKeyframeTrack(
        `${vrmNodeName}.${propertyName}`, track.times,
        track.values.map((v) => v * hipsPositionScale),
      ));
    }
  }
  return new THREE.AnimationClip(url, clip.duration, tracks);
}

let avatar = null, mixer = null;
const actions = {};
let current = 'idle';
const ONESHOT = new Set(['jab', 'hook', 'kick', 'backflip', 'flykick', 'wave', 'cheer', 'punch', 'spinkick', 'jump', 'climb', 'clap', 'bow']);
function fadeTo(name) {
  if (!mixer || !actions[name] || current === name) return;
  actions[name].reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(0.18).play();
  actions[current]?.fadeOut(0.18);
  current = name;
}
try {
  const loader = new GLTFLoader();
  loader.register((p) => new VRMLoaderPlugin(p));
  const gltf = await loader.loadAsync('https://raw.githubusercontent.com/pixiv/three-vrm/dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');
  avatar = gltf.userData.vrm;
  VRMUtils.rotateVRM0(avatar);
  scene.add(avatar.scene);
  mixer = new THREE.AnimationMixer(avatar.scene);
  // モーションはローカル資産(assets-lab)。無くても世界は動く(移動・spawn・sayは生きる)
  // idle は落ち着いた呼吸(2026-08-03 ユーザー要望)。旧Fighting Idleは guard として残す
  // M130: 後半6本は派手モーション枠。assets-lab/ に同名FBXを置くだけで有効になる(未配置なら警告のみ)
  const MOTIONS = { idle: 'Breathing Idle', guard: 'Fighting Idle', jab: 'Lead Jab', hook: 'Hook Punch', kick: 'Roundhouse Kick', walk: 'Walking', sit: 'Sitting Idle',
    backflip: 'Backflip', flykick: 'Flying Kick', run: 'Fast Run', wave: 'Waving', dance: 'Samba Dancing', cheer: 'Victory',
    punch: 'Cross Punch', spinkick: 'Mma Kick', jump: 'Jump', climb: 'Climbing Up Wall',
    // M143: 作業/思考モーション(建築中=Digging・考え中=Thinking を自動再生)+挨拶系
    hammer: 'Digging', think: 'Thinking', clap: 'Clapping', bow: 'Quick Formal Bow' };
  await Promise.all(Object.entries(MOTIONS).map(async ([k, f]) => {
    try {
      actions[k] = mixer.clipAction(await loadMixamo(`./assets-lab/${f}.fbx`, avatar));

// ================= b案P1: 微動(呼吸・まばたき・視線ゆらぎ・髪揺れ) =================
// 「生きてる感」の土台=完全静止の人形感を消す。モーション(mixer)が書いたrawボーンの上に
// 毎フレーム極小の加算をする方式。vrm.update()は使わない: humanoid.update()が
// normalized(静止姿勢)でrawを上書きしMixamoリターゲットを壊すため。個別マネージャのみ回す
const micro = { t: 0, nextBlinkAt: 2 + Math.random() * 3, blinkUntil: 0, canBlink: null,
  gp1: Math.random() * 99, gp2: Math.random() * 99 };
function microMotion(dt) {
  if (!avatar) return;
  micro.t += dt;
  const h = avatar.humanoid;
  // 呼吸: 3.8秒周期の胸のわずかな前後(Breathing Idle素材への上乗せなので極小振幅)
  const chest = h?.getRawBoneNode?.('chest') ?? h?.getRawBoneNode?.('spine');
  if (chest) chest.rotation.x += Math.sin(micro.t * (Math.PI * 2 / 3.8)) * 0.012;
  // 視線ゆらぎ: 静止中だけ頭が低速でわずかに泳ぐ(移動・face指示中は邪魔しない)
  const head = h?.getRawBoneNode?.('head');
  if (head && !moveTarget && !faceTarget) {
    head.rotation.y += (Math.sin(micro.t * 0.31 + micro.gp1) * 0.6 + Math.sin(micro.t * 0.83 + micro.gp2) * 0.4) * 0.045;
    head.rotation.x += Math.sin(micro.t * 0.47 + micro.gp2) * 0.02;
  }
  // まばたき: 2〜5.5秒間隔で120ms。表情が無いアバター(現サンプル)では静かに何もしない
  //(ヒナタVRM=VRoid製は blink 表情を必ず持つので、体が来た日に自動で目が生きる)
  const em = avatar.expressionManager;
  if (em) {
    if (micro.canBlink === null) micro.canBlink = !!em.getExpression?.('blink');
    if (micro.canBlink) {
      if (micro.t >= micro.nextBlinkAt) {
        micro.blinkUntil = micro.t + 0.12;
        micro.nextBlinkAt = micro.t + 2 + Math.random() * 3.5;
      }
      const rem = micro.blinkUntil - micro.t;
      em.setValue('blink', rem > 0 ? Math.sin((1 - rem / 0.12) * Math.PI) : 0);
      em.update();
    }
  }
  avatar.springBoneManager?.update(dt); // 髪・服の揺れ(こちらもヒナタVRMで本領発揮)
}

 * M118(P1): build — エージェントが書いた three.js コードで自由造形する。

  const d = document.createElement('div');

  while (chatlog.children.length > 40) chatlog.removeChild(chatlog.firstChild);

function say(text) {

  bub.style.opacity = '1';
  bubUntil = performance.now() + Math.max(3000, Math.min(9000, text.length * 120));

/** M141: VOICEVOX読み上げ。エンジン停止・失敗時は false(呼び元が従来の間で代替) */
async function speak(text) {
  if (!TTS || !text) return false;
  try {
    const r = await fetch(`/api/world/tts?spk=${TTS_SPK}&text=${encodeURIComponent(text.slice(0, 280))}`);
    if (!r.ok) return false;
    const url = URL.createObjectURL(await r.blob());
    await new Promise((res) => {
      const a = new Audio(url);
      let done = false;
      const fin = () => { if (!done) { done = true; URL.revokeObjectURL(url); res(); } };
      a.onended = fin; a.onerror = fin;
      setTimeout(fin, 30_000);
      a.play().catch(fin);
    });
    return true;
  } catch { return false; }
}

let actx = null;
function chime(fs) {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
  const t0 = actx.currentTime;
  fs.forEach((f) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + 0.3);
  });
}
const input = document.getElementById('chatin');

  if (!ok) addMsg('sys', '送信に失敗(アプリが起動しているか確認)');
  else addMsg('sys', 'AMA-terasが考えています…');
}

const _box = new THREE.Box3();
const _size = new THREE.Vector3();
function snapshot() {
  return {
    avatar: avatar ? { x: +avatar.scene.position.x.toFixed(2), z: +avatar.scene.position.z.toFixed(2), motion: current } : undefined,
    objects: [...objects.entries()].map(([id, o]) => {
      // 実寸(バウンディングボックス)。エージェントの「メジャー」— 配置計算の根拠になる
      _box.setFromObject(o.mesh);
      _box.getSize(_size);
      return {
        id, shape: o.shape, ...(o.label ? { label: o.label } : {}),
        x: o.x, z: o.z, w: +_size.x.toFixed(1), h: +_size.y.toFixed(1), d: +_size.z.toFixed(1),
        // 高さ方向の計測: bottom=接地/浮きの判定、top=最上端(積み上げ計算に使う)
        bottom: +_box.min.y.toFixed(1), top: +_box.max.y.toFixed(1),
      };
    }),
    apps: [...worldApps.values()].map((r) => ({
      id: r.def.id, name: r.def.name, x: r.def.x, z: r.def.z, ...(openAppId === r.def.id ? { open: true } : {}),
    })),
    note: `viewers:1 viewport:${innerWidth}x${innerHeight}`,
  };
}

// ================= 方眼紙モード(cam=top: 正射投影の設計図ビュー) =================
function makeTextSprite(text, color = '#5a6b9e', px = 48) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 96;
  const g = cv.getContext('2d');
  g.font = `bold ${px}px 'Segoe UI',monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#ffffffcc';
  const w = Math.min(250, g.measureText(text).width + 18);
  g.fillRect(128 - w / 2, 10, w, 76);
  g.fillStyle = color;
  g.fillText(text, 128, 48);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  sp.scale.set(2.2, 0.82, 1);
  return sp;
}
// 図面ビュー: top=平面図(x/z) / side=正面立面図(x/y・高さが測れる) / sidex=側面立面図(z/y)
const ORTHO_MODE = ['top', 'side', 'sidex'].includes(CAM_PRESET) ? CAM_PRESET : null;
let orthoCam = null;
const idLabels = new THREE.Group();
if (ORTHO_MODE) {
  orthoCam = new THREE.OrthographicCamera(-13, 13, 13, -13, 0.1, 120);
  const measureBox = new THREE.Box3();
  if (ORTHO_MODE === 'top') {
    orthoCam.position.set(0, 40, 0);
    orthoCam.up.set(0, 0, -1);
    orthoCam.lookAt(0, 0, 0);
    const grid = new THREE.GridHelper(40, 40, 0x7c9bff, 0xd5ddf5);
    grid.position.y = 0.03;
    scene.add(grid);
    for (let v = -12; v <= 12; v += 4) {
      const lx = makeTextSprite(`x${v}`, '#7c9bff', 40); lx.position.set(v, 0.2, -12.6); scene.add(lx);
      const lz = makeTextSprite(`z${v}`, '#c98bd4', 40); lz.position.set(-12.6, 0.2, v); scene.add(lz);
    }
  } else {
    // 立面図: 垂直グリッド(1m方眼)を奥に立て、高さラベルを縁に置く
    const fromX = ORTHO_MODE === 'sidex';
    orthoCam.position.set(fromX ? 50 : 0, 5.5, fromX ? 0 : 50);
    orthoCam.lookAt(0, 5.5, 0);
    const grid = new THREE.GridHelper(40, 40, 0x7c9bff, 0xd5ddf5);
    if (fromX) { grid.rotation.z = Math.PI / 2; grid.position.x = -14; }
    else { grid.rotation.x = Math.PI / 2; grid.position.z = -14; }
    grid.position.y = 20 - 1; // 方眼の中心を地面上(y=0..)に寄せる(40m盤面の半分-1)
    scene.add(grid);
    // 立面の画角は half=7(縦-1.5〜12.5)。ラベルは必ず入る位置(±9)に置く
    for (let y = 0; y <= 10; y += 2) {
      const ly = makeTextSprite(`y${y}`, '#e0508a', 40);
      ly.position.set(fromX ? 0 : -9, y, fromX ? -9 : 0);
      scene.add(ly);
      const ly2 = makeTextSprite(`y${y}`, '#e0508a', 40);
      ly2.position.set(fromX ? 0 : 9, y, fromX ? 9 : 0);
      scene.add(ly2);
    }
    for (let v = -8; v <= 8; v += 4) {
      const lh = makeTextSprite(fromX ? `z${v}` : `x${v}`, '#7c9bff', 40);
      lh.position.set(fromX ? 0 : v, -0.9, fromX ? v : 0);
      scene.add(lh);
    }
  }
  scene.add(idLabels);
  // オブジェクトID札(2秒ごとに現況へ同期)。立面では最上端の少し上に置く=高さも読める
  setInterval(() => {
    idLabels.clear();
    for (const [id, o] of objects) {
      let topY = 4;
      try { measureBox.setFromObject(o.mesh); topY = measureBox.max.y + 0.6; } catch { /* 空グループ等 */ }
      const sp = makeTextSprite(id, '#34406b', 44);
      sp.position.set(o.x, ORTHO_MODE === 'top' ? 4 : topY, o.z);
      idLabels.add(sp);
    }
    if (avatar) {
      const a = makeTextSprite('AVATAR', '#e0508a', 44);
      a.position.set(avatar.scene.position.x, ORTHO_MODE === 'top' ? 4 : 2.1, avatar.scene.position.z);
      idLabels.add(a);
    }
  }, 2000);
}

// ================= M121: 世界内レコーダー(実行係専用) =================
let recorder = null, recChunks = [];
function startRecording() {
  if (recorder) throw new Error('record: すでに録画中');
  const stream = renderer.domElement.captureStream(30);
  recChunks = [];
  recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8_000_000 });
  recorder.ondataavailable = (e) => { if (e.data.size > 0) recChunks.push(e.data); };
  recorder.start(1000);
}
async function stopRecording() {
  if (!recorder) throw new Error('record: 録画していない');
  const rec = recorder;
  recorder = null;
  await new Promise((resolve) => { rec.onstop = resolve; rec.stop(); });
  const blob = new Blob(recChunks, { type: 'video/webm' });
  recChunks = [];
  const r = await fetch(`/api/world/recording?k=${EXEC_KEY}`, { method: 'POST', headers: { 'content-type': 'video/webm' }, body: blob });
  if (!r.ok) throw new Error(`record: 保存に失敗(${r.status})`);
  const j = await r.json();
  console.log('[world] 録画保存:', j.file);
}

// ================= コマンド実行(SSE受信・直列実行・ack) =================
let moveTarget = null; // {x,z,resolve}
let faceTarget = null; // M139 {yaw, resolve}
const ONESHOT_WAIT_MAX = 5000;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/** ワンショット技の完了を待つ(連続motionコマンドが技を上書きして「見えない」事故の対策) */
function waitMotionEnd(name) {
  return new Promise((resolve) => {
    const timer = setTimeout(done, ONESHOT_WAIT_MAX);
    function done() { clearTimeout(timer); mixer?.removeEventListener('finished', onFin); resolve(); }
    function onFin(e) { if (e.action === actions[name]) done(); }
    mixer?.addEventListener('finished', onFin);
  });
}
async function runCommand(c, quiet = false) {
  switch (c.type) {
    case 'say': {
      const text = c.text ?? '';
      say(text);
      touchAppIdle();
      // M141: 配信画面では大きな字幕+音声読み上げ(スマホでチャットが読めない問題の対策)
      if (SPECTATE) showSubtitle(text, Math.max(3500, Math.min(20_000, text.length * 160)));
      if (!quiet) {
        const spoken = await speak(text);
        if (SPECTATE) { clearTimeout(subTimer); subTimer = setTimeout(() => { subtitle.style.display = 'none'; }, 1200); }
        // 読み終わる間を取る(連続sayの上書き防止・演出のテンポ)。読み上げ済みなら追加の間は不要
        if (!spoken) await sleep(Math.min(2200, 500 + text.length * 35));
      }
      return;
    }
    case 'live_comment':
      renderLiveComment(c);
      return;
    case 'motion':
      if (!actions[c.name]) throw new Error(`motion: ${c.name} のFBXが未配置(assets-labに追加すると使える)`);
      fadeTo(c.name);
      if (ONESHOT.has(c.name)) await waitMotionEnd(c.name);
      return;
    case 'move_to': {
      if (!avatar) throw new Error('avatar未ロード');
      // M130: 遠距離はrunモーション(FBXがあれば)で駆ける=キビキビ
      const distM = Math.hypot(c.x - avatar.scene.position.x, c.z - avatar.scene.position.z);
      const useRun = distM > 5 && actions.run;
      fadeTo(useRun ? 'run' : 'walk');
      await new Promise((resolve) => { moveTarget = { x: c.x, z: c.z, resolve, speed: useRun ? 3.2 : 1.3 }; });
      fadeTo('idle');
      return;
    }
    case 'spawn': {
      const id = spawnObject(c, quiet);
      if (!quiet) camFocusTo(objects.get(id).mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
      return;
    }
    case 'remove': {
      const o = objects.get(c.id);
      if (!o) throw new Error(`remove: id=${c.id} は存在しない`);
      scene.remove(o.mesh);
      objects.delete(c.id);
      return;
    }
    case 'camera': {
      if (c.target === 'shoulder') { camMode = 'shoulder'; return; } // M139: 肩越し追従(次のcamera系まで維持)
      camMode = null;
      if (c.target === 'overview') camFocusTo(new THREE.Vector3(0, 0, 0), new THREE.Vector3(14, 13, 14));
      else if (c.target === 'object') { /* 直近spawn時に設定済み。明示指定は最後のspawn位置のまま */ }
      else if (avatar) camFocusTo(avatar.scene.position.clone().add(new THREE.Vector3(0, 1.1, 0)));
      return;
    }
    case 'camera_to': {
      // M139: 自由カメラ。位置(x,y,z)と注視点(lx,ly,lz)へ滑らかに移動
      camMode = null;
      camTween = {
        target: new THREE.Vector3(c.lx ?? 0, c.ly ?? 1.2, c.lz ?? 0),
        pos: new THREE.Vector3(c.x ?? 6, c.y ?? 4, c.z ?? 6),
        until: performance.now() + (typeof c.ms === 'number' ? c.ms : 4_000),
      };
      await sleep(Math.min(typeof c.ms === 'number' ? c.ms : 1_500, 4_000));
      return;
    }
    case 'face': {
      // M139: アバターを指定座標の方へ向ける(肩越しカメラと組で「一緒に見る」が成立)
      if (!avatar) throw new Error('avatar未ロード');
      await new Promise((resolve) => { faceTarget = { yaw: Math.atan2(c.x - avatar.scene.position.x, c.z - avatar.scene.position.z), resolve }; });
      return;
    }
    case 'record': {
      // M121: 録画は実行係だけが担う(他のページで多重録画しない)。閲覧ページは黙って成功扱い
      if (!EXECUTOR) return;
      if (c.op === 'start') startRecording();
      else await stopRecording();
      return;
    }
    case 'live_hud': {
      // M125: 配信HUD+ライブ防御の切替(表示のみ・ackはしない扱いでよいが直列実行上は即完了)
      applyLiveHud(c.hud);
      return;
    }
    case 'app_add': upsertApp(c.app, quiet); if (!quiet) camFocusTo(new THREE.Vector3(c.app.x, 1.2, c.app.z)); return;
    case 'app_move': {
      const rec = worldApps.get(c.appId);
      if (!rec) throw new Error(`app_move: id=${c.appId} は存在しない`);
      rec.def.x = c.x; rec.def.z = c.z;
      if (typeof c.y === 'number') rec.def.y = c.y;
      rec.mesh.position.set(c.x, rec.def.y ?? 0, c.z);
      if (typeof c.ry === 'number') { rec.def.ry = c.ry; rec.mesh.rotation.y = c.ry; }
      return;
    }
    case 'app_remove': removeAppMesh(c.appId); closeApp(c.appId); return;
    case 'app_open': {
      // M127: どの社を使うか見て分かるように、アバターが社の前まで歩いてから開く
      const rec = worldApps.get(c.appId);
      if (!rec) throw new Error(`app_open: id=${c.appId} は存在しない`);
      if (avatar && !quiet) {
        const p = rec.mesh.position;
        const a = avatar.scene.position;
        const dx = a.x - p.x, dz = a.z - p.z;
        const d = Math.hypot(dx, dz);
        if (d > 1.6) {
          const tx = p.x + (dx / d) * 1.3, tz = p.z + (dz / d) * 1.3;
          camFocusTo(p.clone().add(new THREE.Vector3(0, 1.2, 0)));
          fadeTo('walk');
          await new Promise((resolve) => { moveTarget = { x: tx, z: tz, resolve }; });
          fadeTo('idle');
        }
        // 社の方を向く
        avatar.scene.rotation.y = Math.atan2(p.x - a.x, p.z - a.z);
        await sleep(350);
      }
      openApp(c.appId);
      await sleep(600);
      return;
    }
    case 'app_leave': leaveApp(); return;
    case 'app_close': closeApp(c.appId); return;
    case 'app_state': {
      // M129b: main経由で配られたアプリ状態(自分発のエコーは同値上書きで無害)。
      // M132: appState未指定=アプリ終了によるクリア(社のtickはundefinedを受けて初期表示へ)
      if (c.appState === undefined) appStates.delete(c.appId);
      else appStates.set(c.appId, c.appState);
      // M141: 表示中アプリが動いている間は自動退出させない(実演の途中で畳まない)
      if (c.appId === openAppId) touchAppIdle();
      // M129c: 新しいstateが来たらtickを蘇生(壊れたstateで止まっていた社が復帰できる)
      const rec = worldApps.get(c.appId);
      if (rec) rec.tickErrs = 0;
      return;
    }
    case 'chat_restore':
      // M128: 再入場時に世界の記憶(直近チャット)を表示復元。restorePayload(quiet)専用。
      // helloは再接続のたびに走るので、二重表示しないよう洗い替えにする
      chatlog.innerHTML = '';
      for (const en of c.entries ?? []) {
        addMsg(en.from === 'agent' ? 'agent' : en.from === 'user' ? 'user' : 'sys', en.text);
      }
      return;
    case 'app_point': await pointInApp(c.selector, c.note); touchAppIdle(); await sleep(800); return;
    case 'app_click': await appOp('click', c.selector); touchAppIdle(); await sleep(500); return;
    case 'app_type': await appOp('type', c.selector, c.text); touchAppIdle(); await sleep(400); return;
    case 'app_read': {
      const r = await appOp('read', c.selector);
      touchAppIdle();
      pendingNotes.push(`app_read ${c.selector} = ${JSON.stringify(r.text ?? '')}`);
      return;
    }
    default: throw new Error(`未知のコマンド: ${c.type}`);
  }
}
const cmdQueue = [];
const pendingNotes = []; // M126: app_read の読み取り結果を ack に載せてエージェントへ返す
let running = false;
async function pump() {
  if (running) return;
  running = true;
  while (cmdQueue.length > 0) {
    const { seq, cmds, quiet } = cmdQueue.shift();
    const errors = [];
    pendingNotes.length = 0;
    for (const c of cmds) {
      try { await runCommand(c, quiet === true); } catch (e) { errors.push(`${c.type}: ${e?.message ?? e}`); }
    }
    await post({ kind: 'ack', seq, ok: errors.length === 0, ...(errors.length ? { errors } : {}),
      ...(pendingNotes.length ? { notes: [...pendingNotes] } : {}), state: snapshot() });
  }
  running = false;
}

// ================= SSE接続 =================
const badge = document.getElementById('badge');
const bst = document.getElementById('bst');
function connect() {
  // 実行係も受信は観戦SSE(ループバック・world:eventのみ)で足りる。送信側だけ実行キーを使う
  const es = (SPECTATE || EXECUTOR)
    ? new EventSource('/api/world/spectate')
    : new EventSource(`/api/events?token=${encodeURIComponent(TOKEN ?? '')}`);
  es.addEventListener('world:event', (e) => {
    try {
      const payload = JSON.parse(e.data);
      cmdQueue.push(payload);
      void pump();
    } catch (err) { console.error('[world] bad payload', err); }

// ================= M120: 社のタップ/長押しドラッグ =================
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const _groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function kioskAt(clientX, clientY) {
  _ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  _ray.setFromCamera(_ndc, camera);
  for (const rec of worldApps.values()) {
    // M137: userData.noTap = true の部品(演出ドーム等)はタップ判定から除外する
    const hits = _ray.intersectObject(rec.mesh, true);
    for (const h of hits) {
      let o = h.object, tappable = true;
      while (o && o !== rec.mesh.parent) {
        if (o.userData?.noTap === true) { tappable = false; break; }
        o = o.parent;
      }
      if (tappable) return rec;
    }
  }
  return null;
}
let tapStart = null; // {x,y,t,kiosk}
let pendingFocus = null;
let lastTap = { t: 0, id: null };
let dragging = null; // {rec}
let holdTimer = null;
addEventListener('pointerdown', (e) => {
  if (e.target.closest('#chatbar') || e.target.closest('#chatlog') || e.target.closest('#appov') || e.target.closest('#kioskctl')) return;
  const rec = kioskAt(e.clientX, e.clientY);
  tapStart = { x: e.clientX, y: e.clientY, t: performance.now(), kiosk: rec };
  // M136: 固定中の社は長押しドラッグを発動しない(スマホの誤移動防止)
  if (rec && !SPECTATE && rec.def.locked !== true) {
    holdTimer = setTimeout(() => {
      // 長押し=移動モード(カメラを止めて地面に沿ってドラッグ)
      dragging = { rec };
      controls.enabled = false;
      chime([330, 330]);
    }, 450);
  }
});
addEventListener('pointermove', (e) => {
  if (tapStart && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > 12 && holdTimer) {
    clearTimeout(holdTimer); holdTimer = null; // 動いたら長押し取り消し(カメラ操作を優先)
  }
  if (dragging) {
    _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    _ray.setFromCamera(_ndc, camera);
    const hit = new THREE.Vector3();
    if (_ray.ray.intersectPlane(_groundPlane, hit)) {
      const r = Math.hypot(hit.x, hit.z);
      if (r > 18) { hit.multiplyScalar(18 / r); }
      // M127: 高所(y)設置はエージェント経由で行い、ドラッグは水平移動のみ=高さは保つ
      dragging.rec.mesh.position.set(hit.x, dragging.rec.mesh.position.y, hit.z);
    }
  }
});
addEventListener('pointerup', (e) => {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  if (dragging) {
    const p = dragging.rec.mesh.position;
    dragging.rec.def.x = +p.x.toFixed(2); dragging.rec.def.z = +p.z.toFixed(2);
    void post({ kind: 'app_moved', appId: dragging.rec.def.id, x: dragging.rec.def.x, z: dragging.rec.def.z });
    dragging = null;
    controls.enabled = true;
    tapStart = null;
    return;
  }
  if (!tapStart) return;
  const isTap = performance.now() - tapStart.t < 350 && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 12;
  const rec = tapStart.kiosk;
  tapStart = null;
  if (!isTap || !rec) return;
  const now = performance.now();
  if (lastTap.id === rec.def.id && now - lastTap.t < 450) {
    // ダブルタップ=起動(3Dで見つけて2Dで使う)。見学モードは封鎖(視点操作だけの覗き窓)
    lastTap = { t: 0, id: null };
    if (VIEWER) { addMsg('sys', '(見学モードではアプリは開けません)'); return; }
    if (pendingFocus) { clearTimeout(pendingFocus); pendingFocus = null; }
    try { openApp(rec.def.id); } catch (err) { addMsg('sys', String(err?.message ?? err)); }
    return;
  }
  lastTap = { t: now, id: rec.def.id };
  // シングルタップ=名札+配置コントロール。カメラ寄せは2タップ目の照準を狂わせないよう遅延実行
  addMsg('sys', `🏛 ${rec.def.name}${rec.def.description ? ' — ' + rec.def.description : ''}${VIEWER ? '' : '(ダブルタップで開く・長押しで移動)'}`);
  if (!SPECTATE) showKioskCtl(rec);
  if (pendingFocus) clearTimeout(pendingFocus);
  pendingFocus = setTimeout(() => {
    pendingFocus = null;
    // M131: 社の「正面」(ryの向き)へカメラごと回り込む=どの向きに置かれていても表示が読める
    const p = rec.mesh.position;
    const ry = rec.def.ry ?? 0;
    const front = new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry));
    camFocusTo(
      p.clone().add(new THREE.Vector3(0, 1.4, 0)),
      p.clone().add(front.multiplyScalar(4.2)).add(new THREE.Vector3(0, 1.8, 0)),
    );
  }, 500);
});

// ================= カメラ(OrbitControls: 1本指=回転/ピンチ=ズーム/2本指=パン) =================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI * 0.55; // 地面下へ潜り込みすぎない
controls.target.set(0, 1.05, 0);
camera.position.set(1.5, 2.4, 4.2);
// エージェントのcamera演出: 目標へ滑らかに寄せる。ユーザーが触ったら即座に主導権を返す
let camTween = null; // {target, pos?|null, until?: ms}
function camFocusTo(target, pos = null) {
  // M141: 配信の自動監督(cam=auto)は「ゆっくり移動」ではなく「カット切替→ゆっくり寄る」。
  // テレビのスイッチング的なテンポになり、見せ場が明確になる(初回配信の「引きすぎ」反省)
  if (CAM_AUTO) {
    let from = pos;
    if (from === null) {
      const dir = new THREE.Vector3().subVectors(camera.position, target);
      dir.y = 0;
      if (dir.length() < 0.5) dir.set(1, 0, 1);
      dir.normalize();
      from = target.clone().add(dir.multiplyScalar(8)).add(new THREE.Vector3(0, 2.4, 0));
    }
    camera.position.copy(from);
    controls.target.copy(target);
    const push = from.clone().lerp(target, 0.3);
    push.y = Math.max(1.3, from.y * 0.85);
    camTween = { target: target.clone(), pos: push, until: performance.now() + 3_500 };
    return;
  }
  camTween = { target, pos, until: performance.now() + 4_000 };
}
// M139: カメラモード。'shoulder'=アバターの肩越し(頭の高さ・水平・頭大きめ)を追従し続ける
let camMode = null;
// M139: 自動監督(配信用 cam=auto): 平常=ゆっくり周回 / イベント=寄り / cameraFocusフラグ=自動追尾
const CAM_AUTO = CAM_PRESET === 'auto';
let focusHunt = { at: 0, mesh: null };
let autoOrbitAng = null; // M139: 自動周回の現在角(null=非周回中)
function findCameraFocus() {
  // 毎フレームtraverseは重いので500ms毎に走査
  if (performance.now() - focusHunt.at < 500) return focusHunt.mesh;
  focusHunt.at = performance.now();
  let best = null, bestPri = -1;
  const scan = (root) => {
    root.traverse((o) => {
      const cf = o.userData?.cameraFocus;
      if (cf && cf.active === true && (cf.priority ?? 0) > bestPri) { best = o; bestPri = cf.priority ?? 0; }
    });
  };
  for (const o of objects.values()) scan(o.mesh);
  for (const r of worldApps.values()) scan(r.mesh);
  focusHunt.mesh = best;
  // M141: 対象の実寸(バウンディング半径)も測る=追尾距離をサイズに合わせる(巨大月で画面が埋まる対策)
  if (best) {
    try {
      const bb = new THREE.Box3().setFromObject(best);
      const sz = bb.getSize(new THREE.Vector3());
      focusHunt.radius = Math.max(sz.x, sz.y, sz.z) / 2;
    } catch { focusHunt.radius = 4; }
  } else focusHunt.radius = null;
  return best;
}
controls.addEventListener('start', () => { camTween = null; camMode = null; });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer && avatar) {
    mixer.update(dt);
    microMotion(dt); // b案P1: 呼吸・まばたき・視線ゆらぎ(mixerの後=加算が消されない)
    // move_to の移動(0.9m/s・向き追従)
    if (moveTarget) {
      const pos = avatar.scene.position;
      const dir = new THREE.Vector3(moveTarget.x - pos.x, 0, moveTarget.z - pos.z);
      if (dir.length() < 0.15) {
        const r = moveTarget.resolve; moveTarget = null; r();
      } else {
        dir.normalize();
        // M127: 歩き1.3m/s(これ以上は足が滑る)。M130: runモーション時は3.2m/s
        pos.add(dir.clone().multiplyScalar(dt * (moveTarget.speed ?? 1.3)));
        const yaw = Math.atan2(dir.x, dir.z);
        let dy = yaw - avatar.scene.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        avatar.scene.rotation.y += dy * Math.min(1, dt * 8);
      }
    }
    // M139: face(指定方向へ向く)
    if (faceTarget) {
      let dy = faceTarget.yaw - avatar.scene.rotation.y;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      if (Math.abs(dy) < 0.05) {
        avatar.scene.rotation.y = faceTarget.yaw;
        const r = faceTarget.resolve; faceTarget = null; r();
      } else {
        avatar.scene.rotation.y += dy * Math.min(1, dt * 5);
      }
    }
    applyWorkHammer(); // M143: mixerの後・vrm反映の前に腕を上書き(作業トンカチ)
    avatar.update(dt);
    // 吹き出し追従
    if (performance.now() < bubUntil) {
      const p = avatar.scene.position.clone().add(new THREE.Vector3(0, 1.85, 0)).project(camera);
      bub.style.left = Math.max(6, Math.min(innerWidth - 200, (p.x + 1) / 2 * innerWidth - 60)) + 'px';
      bub.style.top = Math.max(40, (1 - (p.y + 1) / 2) * innerHeight - 64) + 'px';
    } else bub.style.opacity = '0';
  }
  // オブジェクトのポップイン+M127: 動くオブジェクト(userData.tick)。
  // M129c: 例外1回で永久停止は厳しすぎた(不正なstate値1つで社の表示が凍結し、
  // 正しい値が来ても直らない事故が実際に起きた)→10回まで許容+新stateで蘇生
  const tSec = performance.now() / 1000;
  for (const o of objects.values()) {
    const t = (performance.now() - o.born) / 400;
    if (t < 1) o.mesh.scale.setScalar(0.01 + 0.99 * (1 - Math.pow(1 - t, 3)));
    else o.mesh.scale.setScalar(1);
    if (o.tick && !(o.tickErrs >= 10)) {
      try { o.tick(dt, tSec); } catch (e) { o.tickErrs = (o.tickErrs ?? 0) + 1; console.warn('[world] tickエラー:', e); }
    }
  }
  for (const rec of worldApps.values()) {
    if (rec.tick && !(rec.tickErrs >= 10)) {
      // M137: 第4引数=全アプリのstate(他アプリ連動用。例: 月アプリが時計アプリのアラームを読む)
      try { rec.tick(dt, tSec, appStates.get(rec.def.id), appStates); }
      catch (e) { rec.tickErrs = (rec.tickErrs ?? 0) + 1; console.warn('[world] kiosk tickエラー:', e); }
    }
  }
  // 図面モード: 正射投影(遠近の歪みゼロ=計測ができる)。top=平面図 / side・sidex=立面図
  if (ORTHO_MODE && orthoCam) {
    const aspect = innerWidth / innerHeight;
    const half = ORTHO_MODE === 'top' ? 13 : 7;
    orthoCam.left = -half * aspect; orthoCam.right = half * aspect;
    orthoCam.top = half; orthoCam.bottom = -half;
    orthoCam.updateProjectionMatrix();
    renderer.render(scene, orthoCam);
    return;
  }
  // 固定カメラプリセット(観戦スクショ用): pov=アバターの目 / front=正面 / overview=俯瞰
  if (CAM_PRESET && CAM_PRESET !== 'auto' && avatar) {
    const p = avatar.scene.position, yaw = avatar.scene.rotation.y;
    const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    if (CAM_PRESET === 'pov') {
      camera.position.set(p.x + fwd.x * 0.2, 1.45, p.z + fwd.z * 0.2);
      camera.lookAt(p.x + fwd.x * 5, 1.35, p.z + fwd.z * 5);
    } else if (CAM_PRESET === 'front') {
      camera.position.set(p.x + fwd.x * 2.8, 1.4, p.z + fwd.z * 2.8);
      camera.lookAt(p.x, 1.15, p.z);
    } else if (CAM_PRESET === 'overview') {
      camera.position.set(13, 12, 13);
      camera.lookAt(0, 0, 0);
    }
    renderer.render(scene, camera);
    return;
  }
  // M139: カメラ制御の優先順位: 肩越しモード > cameraFocus自動追尾(auto) > 演出トゥイーン > 自動周回(auto)
  // M142: 見上げ角上限は毎フレーム既定に戻す(focus追尾中だけ緩める)
  controls.maxPolarAngle = Math.PI * 0.55;
  if (camMode === 'shoulder' && avatar) {
    autoOrbitAng = null;
    const p = avatar.scene.position, yaw = avatar.scene.rotation.y;
    const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    camera.position.lerp(new THREE.Vector3(p.x - fwd.x * 1.4, 1.62, p.z - fwd.z * 1.4), 0.12);
    controls.target.lerp(new THREE.Vector3(p.x + fwd.x * 6, 1.35, p.z + fwd.z * 6), 0.12);
  } else {
    const focusMesh = CAM_AUTO ? findCameraFocus() : null;
    if (focusMesh) {
      // 見せ場の自動追尾(例: 落下中の月)。M142: 「頭越しショット」— アバターの頭のすぐ後ろ・
      // やや上から対象を見上げる。頭が前景に入り、巨大化した月が空を埋めていく圧が画になる
      // (2026-08-08ユーザー要望: 引きの全体像ではなくキャラの頭越しにズームで見たい)
      const wp = new THREE.Vector3();
      focusMesh.getWorldPosition(wp);
      const anchor = avatar ? avatar.scene.position : new THREE.Vector3();
      const toT = new THREE.Vector3(wp.x - anchor.x, 0, wp.z - anchor.z);
      if (toT.length() < 0.5) toT.set(0, 0, -1); else toT.normalize();
      // 頭(y≈1.5)が画面下端に入る高さ・距離。注視点は対象中心よりやや下(仰角を殺して
      // 頭のシルエットと巨大対象を同じフレームに収める)。
      // 巨大対象の見上げは通常の見上げ角上限(0.55π)を超える — 見せ場中だけ緩める
      controls.maxPolarAngle = Math.PI * 0.85;
      camera.position.lerp(new THREE.Vector3(anchor.x - toT.x * 2.4, 1.35, anchor.z - toT.z * 2.4), 0.12);
      controls.target.lerp(new THREE.Vector3(wp.x, Math.max(2, wp.y * 0.55), wp.z), 0.1);
    } else if (camTween) {
      controls.target.lerp(camTween.target, 0.08);
      if (camTween.pos) camera.position.lerp(camTween.pos, 0.06);
      const done = (controls.target.distanceTo(camTween.target) < 0.05 &&
        (!camTween.pos || camera.position.distanceTo(camTween.pos) < 0.2)) ||
        (camTween.until !== undefined && performance.now() > camTween.until);
      if (done) camTween = null;
    } else if (CAM_AUTO && moveTarget && avatar) {
      // M141: 移動中は後方追従=主役(アバター)を見失わない。「何を見ればいいか分からない」対策
      autoOrbitAng = null;
      const p = avatar.scene.position, yaw = avatar.scene.rotation.y;
      const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      camera.position.lerp(new THREE.Vector3(p.x - fwd.x * 3.4, 2.15, p.z - fwd.z * 3.4), 0.07);
      controls.target.lerp(new THREE.Vector3(p.x + fwd.x * 2.5, 1.3, p.z + fwd.z * 2.5), 0.1);
    } else if (CAM_AUTO) {
      // M141: 平常時はアバターを主役に近距離でゆっくり周回(初回配信の「引きすぎて小さい」反省)。
      // 角度は明示的に前進させる(lerp頼みだと進みが食われて止まって見える)
      const cpos = avatar ? avatar.scene.position : new THREE.Vector3();
      if (autoOrbitAng === null) autoOrbitAng = Math.atan2(camera.position.x - cpos.x, camera.position.z - cpos.z);
      autoOrbitAng += dt * 0.05;
      const r = 5.2, h = 2.5;
      camera.position.lerp(new THREE.Vector3(cpos.x + Math.sin(autoOrbitAng) * r, h, cpos.z + Math.cos(autoOrbitAng) * r), 0.06);
      controls.target.lerp(new THREE.Vector3(cpos.x, 1.25, cpos.z), 0.06);
    }
    if (!(CAM_AUTO && !focusMesh && !camTween && camMode === null)) autoOrbitAng = null;
  }
  // M140: billboard文字盤はカメラへ正対(撤去済みメッシュは掃除)
  for (let i = billboardPanels.length - 1; i >= 0; i--) {
    const m = billboardPanels[i];
    if (!m.parent) { billboardPanels.splice(i, 1); continue; }
    if (m.visible) m.lookAt(camera.position);
  }
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
